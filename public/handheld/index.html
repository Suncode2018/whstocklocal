<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WH Stock Handheld - เมนูหลัก</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/wms.css">
  <link rel="stylesheet" href="/css/wms-friendly.css">
</head>
<body class="handheld-wrapper bg-light">

  <div id="handheldHeader"></div>

  <div class="container py-3" style="max-width:500px">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h5 class="fw-bold mb-0">เลือกกระบวนการทำงาน</h5>
        <small class="text-muted">แตะเพื่อเข้าสู่การทำงาน</small>
      </div>
      <button class="btn btn-sm btn-outline-secondary" onclick="location.reload()" title="รีเฟรช"><i class="bi bi-arrow-clockwise"></i></button>
    </div>

    <!-- เมนูการทำงานแยกเป็นการ์ดชัดเจน -->
    <div class="row g-3">
      <div class="col-6">
        <a href="/handheld/receive.html" class="card text-decoration-none border-0 shadow-sm p-3 text-center h-100 rounded-3">
          <div class="fs-1 text-success mb-2">📥</div>
          <div class="fw-bold text-dark">RECEIVE</div>
          <small class="text-muted">รับสินค้าตาม PO</small>
        </a>
      </div>
      <div class="col-6">
        <a href="/handheld/putaway.html" class="card text-decoration-none border-0 shadow-sm p-3 text-center h-100 rounded-3">
          <div class="fs-1 text-primary mb-2">📦</div>
          <div class="fw-bold text-dark">PUTAWAY</div>
          <small class="text-muted">จัดเก็บขึ้นเชลฟ์</small>
        </a>
      </div>
      <div class="col-6">
        <a href="/handheld/scan.html?mode=PICK" class="card text-decoration-none border-0 shadow-sm p-3 text-center h-100 rounded-3">
          <div class="fs-1 text-danger mb-2">📤</div>
          <div class="fw-bold text-dark">PICK</div>
          <small class="text-muted">เบิกจ่ายสินค้า</small>
        </a>
      </div>
      <div class="col-6">
        <a href="/handheld/cyclecount.html" class="card text-decoration-none border-0 shadow-sm p-3 text-center h-100 rounded-3">
          <div class="fs-1 text-info mb-2">🔄</div>
          <div class="fw-bold text-dark">COUNT</div>
          <small class="text-muted">ตรวจนับสต็อก</small>
        </a>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const res = await fetch('/includes/header-handheld.html');
      if (res.ok) document.getElementById('handheldHeader').innerHTML = await res.text();
      
      const payload = typeof requireAuth === 'function' ? requireAuth(['OPERATOR', 'POWERUSER', 'ADMIN']) : null;
      if (payload) {
        document.getElementById('hhUsername').textContent = payload.username || 'พนักงาน';
        document.getElementById('hhRole').textContent = payload.role || 'OPERATOR';
      }
    });

    function doLogout() {
      if (confirm('ต้องการออกจากระบบใช่หรือไม่?')) logout();
    }
  </script>
</body>
</html>
