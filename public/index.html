<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WH Stock · เข้าสู่ระบบ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/wms.css">
  <link rel="stylesheet" href="/css/wms-friendly.css">
</head>
<body class="login-body">

<div class="login-card">
  <div class="login-logo">📦</div>
  <h3 class="fw-bold text-center mb-1">WH Stock System</h3>
  <p class="text-muted text-center small mb-4">เข้าสู่ระบบด้วยบัญชีของคุณ</p>

  <!-- แจ้งเตือนกรณีถูกดีดกลับ -->
  <div id="alertBox" class="alert alert-warning py-2 small text-center d-none" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-1"></i> <span id="alertText">ไม่มีสิทธิ์เข้าถึงหน้านี้</span>
  </div>

  <form onsubmit="handleLogin(event)" novalidate>
    <div class="mb-3">
      <label class="form-label-wms" for="username">ชื่อผู้ใช้</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input type="text" id="username" class="form-control form-control-wms" placeholder="กรอกชื่อผู้ใช้"
               required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus>
      </div>
    </div>

    <div class="mb-2">
      <label class="form-label-wms" for="password">รหัสผ่าน</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" id="password" class="form-control form-control-wms" placeholder="กรอกรหัสผ่าน"
               required autocomplete="current-password">
        <button type="button" class="btn pw-toggle" id="pwToggle" aria-label="แสดง/ซ่อนรหัสผ่าน" onclick="togglePw()">
          <i class="bi bi-eye" id="pwIcon"></i>
        </button>
      </div>
      <div class="caps-warn" id="capsWarn"><i class="bi bi-exclamation-circle me-1"></i>ตัวอักษรใหญ่ (Caps Lock) เปิดอยู่</div>
    </div>

    <div class="form-check mb-4 mt-3">
      <input class="form-check-input" type="checkbox" id="rememberMe">
      <label class="form-check-label small text-muted" for="rememberMe">จำชื่อผู้ใช้ไว้ในเครื่องนี้</label>
    </div>

    <button type="submit" id="loginBtn" class="btn btn-indigo w-100 py-2 fw-bold" style="min-height:52px;font-size:1.05rem">
      <i class="bi bi-box-arrow-in-right me-2"></i>เข้าสู่ระบบ
    </button>
  </form><p class="small text-muted text-center mt-3 mb-0">ระบบจะเปิด Desktop หรือ HH ตามที่ Admin กำหนดให้บัญชีนี้</p>

  <div class="text-center mt-4">
    <small class="text-muted">ระบบนี้สำหรับพนักงานที่ได้รับอนุญาตเท่านั้น<br>ลืมรหัสผ่าน? แจ้งผู้ดูแลระบบ</small>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    const msg = new URLSearchParams(location.search).get('msg');
    if (msg) {
      document.getElementById('alertText').textContent = msg;
      document.getElementById('alertBox').classList.remove('d-none');
    }
    try {
      const saved = localStorage.getItem('wms_last_username');
      if (saved) {
        document.getElementById('username').value = saved;
        document.getElementById('rememberMe').checked = true;
        document.getElementById('password').focus();
      }
    } catch (_) {}
    document.getElementById('password').addEventListener('keyup', e => {
      document.getElementById('capsWarn').style.display =
        (e.getModifierState && e.getModifierState('CapsLock')) ? 'block' : 'none';
    });
  });

  function togglePw() {
    const p = document.getElementById('password');
    const show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    document.getElementById('pwIcon').className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
  }

  function setLoading(on) {
    const b = document.getElementById('loginBtn');
    b.disabled = on;
    b.innerHTML = on
      ? '<span class="spinner-border spinner-border-sm me-2"></span>กำลังเข้าสู่ระบบ...'
      : '<i class="bi bi-box-arrow-in-right me-2"></i>เข้าสู่ระบบ';
  }

  async function handleLogin(event) {
    event.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      Swal.fire({ icon: 'info', title: 'กรอกข้อมูลให้ครบ', text: 'กรุณากรอกทั้งชื่อผู้ใช้และรหัสผ่าน', confirmButtonColor: '#4f46e5' });
      return;
    }

    setLoading(true);
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (!res.ok) {
        setLoading(false);
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
        Swal.fire({ icon: 'error', title: 'เข้าสู่ระบบไม่สำเร็จ', text: data.error || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', confirmButtonColor: '#4f46e5', confirmButtonText: 'ลองอีกครั้ง' });
        return;
      }

      try {
        if (document.getElementById('rememberMe').checked) localStorage.setItem('wms_last_username', username);
        else localStorage.removeItem('wms_last_username');
      } catch (_) {}

      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));

      const role = String(data.user.role || '').toUpperCase();
      document.getElementById('loginBtn').innerHTML = '<i class="bi bi-check-circle me-2"></i>สำเร็จ กำลังเข้าสู่หน้าหลัก...';

      location.href=data.redirect || '/desktop/index.html';

    } catch (err) {
      console.error('Login Error:', err);
      setLoading(false);
      Swal.fire({ icon: 'error', title: 'เชื่อมต่อไม่ได้', text: 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่', confirmButtonColor: '#4f46e5' });
    }
  }
</script>
</body>
</html>
