<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WH Stock Handheld</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/wms.css">
</head>
<body class="handheld-wrapper">

<!-- ══════════ HEADER ══════════ -->
<div class="handheld-header d-flex align-items-center justify-content-between">
  <div class="d-flex align-items-center gap-2">
    <div class="logo-icon" style="width:36px;height:36px;font-size:1.1rem">📱</div>
    <div>
      <div class="brand-title" style="font-size:.95rem">WH Stock Handheld</div>
      <div class="brand-sub">ระบบสแกนรับ/จ่าย Real-time</div>
    </div>
  </div>
  <div class="d-flex align-items-center gap-2">
    <span class="session-badge" id="sessionBadge">
      <i class="bi bi-clock"></i> <span id="sessionTime">--:--</span>
    </span>
    <span class="session-badge" style="cursor:default">
      <i class="bi bi-person-fill"></i>
      <span id="hhUsername">-</span>
      <span class="badge bg-warning text-dark ms-1" id="hhRole">-</span>
    </span>
    <button class="btn-logout" style="padding:.25rem .6rem" onclick="doLogout()" title="ออกจากระบบ">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</div>

<!-- ══════════ MENU SCREEN ══════════ -->
<div id="menuScreen" class="container py-4" style="max-width:500px">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <h5 class="fw-bold mb-0">📋 เลือกรายการปฏิบัติงาน</h5>
    </div>
    <button class="btn btn-sm btn-outline-secondary" onclick="loadDynamicMenus()" title="รีเฟรชเมนู">
      <i class="bi bi-arrow-clockwise"></i> แตะเลือกเมนู
    </button>
  </div>
  <div class="row g-3" id="menuGrid">
    <div class="col-12 text-center py-4 text-muted">
      <span class="spinner-border spinner-border-sm me-2"></span>กำลังโหลดเมนู...
    </div>
  </div>
</div>

<!-- ══════════ OPERATION SCREEN ══════════ -->
<div id="opScreen" class="container py-3" style="max-width:500px; display:none">
  <button class="btn btn-sm btn-outline-secondary mb-3" onclick="backToMenu()">
    <i class="bi bi-arrow-left me-1"></i>กลับเมนูหลัก
  </button>

  <div class="op-panel">
    <!-- Header -->
    <div class="d-flex align-items-center gap-2 mb-3 pb-2 border-bottom">
      <span id="opIcon" style="font-size:1.8rem">📦</span>
      <div>
        <div class="fw-bold" id="opTitle">-</div>
        <div class="text-muted" style="font-size:.8rem" id="opSub">-</div>
      </div>
    </div>

    <!-- Barcode -->
    <div class="mb-3">
      <label class="form-label-wms">🔲 บาร์โค้ด</label>
      <div class="scan-input-wrap">
        <input id="scanBarcode" type="text" class="form-control" placeholder="สแกนหรือพิมพ์บาร์โค้ด..."
          onkeydown="onBarcodeKeydown(event)" autocomplete="off" autocorrect="off">
        <span class="scan-icon"><i class="bi bi-upc-scan"></i></span>
      </div>
    </div>

    <!-- Qty -->
    <div class="mb-3" id="qtyRow">
      <label class="form-label-wms">📊 จำนวน</label>
      <input id="scanQty" type="number" class="form-control form-control-wms" value="1" min="1">
    </div>

    <!-- Location -->
    <div class="mb-3" id="locationRow">
      <label class="form-label-wms">📍 ตำแหน่งจัดเก็บ</label>
      <input id="scanLocation" type="text" class="form-control form-control-wms" placeholder="เช่น A-01, B-02">
    </div>

    <!-- Submit -->
    <button class="btn btn-indigo w-100 py-2" onclick="submitScan()">
      <i class="bi bi-check2-circle me-2"></i>ยืนยันบันทึก
    </button>

    <!-- Result panel -->
    <div id="resultPanel" class="mt-3"></div>
  </div>
</div>

<!-- ══════════ SCRIPTS ══════════ -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/js/common.js"></script>
<script src="/js/handheld-app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', initHandheld);
</script>
</body>
</html>
