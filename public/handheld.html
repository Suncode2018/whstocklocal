<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ปฏิบัติงานคลัง · WH Stock</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f3f5fa;color:#152238}header{background:#172438;color:white;padding:16px}main{max-width:1100px;margin:auto;padding:20px}.card{border:1px solid #e0e5ee;border-radius:16px}.btn,input,select{min-height:44px}label{display:block;margin:10px 0 5px}.table td{vertical-align:middle}#notice{min-height:24px}dialog{border:0;border-radius:16px;width:min(700px,95vw);max-height:90dvh;overflow:auto}dialog::backdrop{background:#0008}</style></head><body><header class="d-flex justify-content-between align-items-center"><strong>WH Stock · ปฏิบัติงานคลัง</strong><a href="/handheld.html" class="btn btn-outline-light btn-sm">เมนูงาน</a></header><main><h3>เลือกงานที่ต้องการทำ</h3><p class="text-muted">ใช้ข้อมูลเดียวกับหน้าหัวหน้าคลัง</p><div class="row g-3" id="cards"></div></main><script src="/js/common.js?v=20261106-modern-1"></script><script>const user=requireAuth();if(user){const permissions=String(user.permissions||'').toUpperCase().split(',').map(x=>x.trim()),manager=['ADMIN','POWERUSER','SUPERVISOR'].includes(user.role);const jobs=[['RECEIVE','receive','รับสินค้า','วัตถุดิบ · Pack · Semi · FG'],['PUTAWAY','putaway','จัดเก็บสินค้า','ทำรายการตามแผนและตรวจตำแหน่ง'],['PICK','pick','เบิกจ่ายสินค้า','วัตถุดิบ · Pack · FG'],['LOAD','load','ส่งสินค้า','ลูกค้า · คลินิก · Fulfillment'],['TRANSFER','transfer','โอนย้ายตำแหน่ง','ภายในคลัง · ตรวจความจุและยอดจอง'],['CYCLECOUNT','cycle-count','ตรวจนับสต๊อก','บันทึกยอดตรวจและส่งให้ Admin ยืนยัน'],['LOOKUP','../handheld/lookup','ค้นหาสต๊อก','สแกนบาร์โค้ดหรือรหัสสินค้า']];document.getElementById('cards').innerHTML=jobs.filter(j=>manager||permissions.includes('ALL')||permissions.includes(j[0])).map(j=>'<div class="col-sm-6"><a class="card p-4 text-decoration-none h-100" href="/supervisor/'+j[1]+'.html"><h4>'+j[2]+'</h4><span class="text-muted">'+j[3]+'</span></a></div>').join('')||'<p>ไม่มีสิทธิ์ทำรายการ กรุณาติดต่อ Admin</p>';}</script></body></html>
