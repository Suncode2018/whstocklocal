<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ค้นหาสต๊อก · WH Stock</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f3f5fa;color:#152238}header{background:#172438;color:white;padding:16px}main{max-width:1100px;margin:auto;padding:20px}.card{border:1px solid #e0e5ee;border-radius:16px}.btn,input,select{min-height:44px}label{display:block;margin:10px 0 5px}.table td{vertical-align:middle}#notice{min-height:24px}dialog{border:0;border-radius:16px;width:min(700px,95vw);max-height:90dvh;overflow:auto}dialog::backdrop{background:#0008}</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"><link rel="stylesheet" href="/css/wms.css"><link rel="stylesheet" href="/css/wms-friendly.css"><link rel="stylesheet" href="/css/supplier-ui.css?v=20261107-1"></head><body class="supplier-ui"><nav class="navbar navbar-dark navbar-wms px-3"><div class="container-fluid p-0 d-flex align-items-center justify-content-between"><div class="d-flex align-items-center gap-3"><button class="btn btn-outline-light border-0 p-2" type="button" onclick="toggleSupplierSidebar()" aria-label="เปิดหรือปิดเมนู"><i class="bi bi-list fs-4"></i></button><div class="logo-icon">📦</div><div><div class="brand-title">WH Stock System</div><div class="brand-sub">ข้อมูลและงานคลังสินค้า</div></div></div><div class="d-flex gap-2 align-items-center"><span class="session-badge"><i class="bi bi-person-circle"></i> <span id="supplierShellUser">—</span><span id="supplierShellRole" class="badge ms-2">USER</span></span><button class="btn-logout" onclick="logout()"><i class="bi bi-box-arrow-right"></i><span class="d-none d-sm-inline ms-1">ออกจากระบบ</span></button></div></div></nav><div class="admin-wrapper" id="adminWrapper"><aside class="admin-sidebar" aria-label="เมนูตามสิทธิ์"></aside><main class="admin-content"><section class="panel-modern supplier-simple-panel"><form id="lookupForm" class="card p-3"><label for="lookupCode">บาร์โค้ด / รหัสสินค้า</label><input class="form-control" id="lookupCode" required autocomplete="off" autofocus><button class="btn btn-primary mt-3">ค้นหา</button></form><p id="notice" role="status" class="mt-3"></p><div id="result"></div></section></main></div><script src="/js/common.js?v=20261107-http-uuid"></script><script>const lookupUser=requireAuth(),lookupEsc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(lookupUser){lookupForm.onsubmit=async e=>{e.preventDefault();notice.textContent='กำลังค้นหา...';result.replaceChildren();try{const r=await fetch('/api/stock/lookup?code='+encodeURIComponent(lookupCode.value.trim()),{headers:authHeaders()});const b=await r.json();if(!r.ok)throw Error(b.message||'ค้นหาไม่สำเร็จ');const p=b.product;result.innerHTML='<section class="card p-3"><h4>'+lookupEsc(p.itemName)+'</h4><p>'+lookupEsc(p.itemCode)+' · '+lookupEsc(p.barcode||'ไม่มีบาร์โค้ด')+'</p><div class="fs-2 fw-bold text-primary">'+Number(p.totalQuantity).toLocaleString('th-TH')+' '+lookupEsc(p.uom)+'</div><div class="table-responsive mt-3"><table class="table"><thead><tr><th>คลัง</th><th>ตำแหน่ง</th><th class="text-end">คงเหลือ</th></tr></thead><tbody>'+p.locations.map(l=>'<tr><td>'+lookupEsc(l.whname||l.whid)+'</td><td>'+lookupEsc(l.locationCode)+'</td><td class="text-end">'+Number(l.quantity).toLocaleString('th-TH')+'</td></tr>').join('')+'</tbody></table></div></section>';notice.textContent='ยอดคงเหลือล่าสุดจากระบบ';}catch(e){notice.textContent=e.message}}}</script><script src="/js/supplier-ui.js?v=20261107-grouped-sidebar"></script>
<script src="/js/navigation-guard.js?v=20261107-dialogs"></script>
</body></html>
